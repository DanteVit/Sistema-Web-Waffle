
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waffle - Registro</title>
    <link rel="icon" href="images/Icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-left">
            <img src="images/logo-original.png" alt="Waffle Logo" class="auth-logo">
            <h1 class="auth-tagline">Unite, juga y califica tus juegos preferidos</h1>
        </div>
        
        <div class="auth-right">
            <div class="auth-card">
                <h2>Registro de Usuario</h2>
                
                <form action="registro-waffle.php" method="POST">
                    <div class="form-group">
                        <label for="nuevo-usuario">Usuario</label>
                        <input type="text" id="nuevo-usuario" name="username" placeholder="Crea tu usuario" required>
                    </div>

                    <div class="form-group">
                        <label for="nueva-password">Contraseña</label>
                        <input type="password" id="nueva-password" name="password" placeholder="Crea una contraseña" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@mail.com" required>
                    </div>

                    <button type="submit" class="boton-piola btn-auth">Crear Cuenta</button>
                </form>

                <p class="auth-switch">
                    ¿Ya tienes cuenta? <a href="login.html">Inicia sesión acá</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
