    </header>
    <main class="main-container">
        <h1 class="main-title">Reproductor de Juegos Flash</h1>
        <div id="contenedor-player" class="contenedor-player">
            <div id="texto-instrucciones" class="texto-instrucciones">
                <h2>Arrastra tu archivo .swf aquí</h2>
                <p>o haz clic para buscarlo en tu computadora</p>
            </div>
        </div>
    <input type="file" class="file-input" id="file-input" accept=".swf">
    </main>
    
    
   

    <!-- Carga de la librería oficial de Ruffle-->
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <script>
        const contenedor = document.getElementById('contenedor-player');
        const fileInput = document.getElementById('file-input');
        const instrucciones = document.getElementById('texto-instrucciones');
        let rufflePlayer = null;

        function obtenerPlayer() {
            if (!rufflePlayer) {
                const ruffle = window.RufflePlayer.newest();
                rufflePlayer = ruffle.createPlayer();
                rufflePlayer.style.width = "100%";
                rufflePlayer.style.height = "100%";
            }
            return rufflePlayer;
        }

        // Eventos para arrastrar archivos (Drag & Drop)
        contenedor.addEventListener('dragover', (e) => {
            e.preventDefault();
            contenedor.classList.add('dragover');
        });

        contenedor.addEventListener('dragleave', () => {
            contenedor.classList.remove('dragover');
        });

        contenedor.addEventListener('drop', (e) => {
            e.preventDefault();
            contenedor.classList.remove('dragover');
            
            const archivos = e.dataTransfer.files;
            if (archivos.length > 0) {
                procesarArchivo(archivos[0]);
            }
        });

        // Permitir clic para buscar archivo
        contenedor.addEventListener('click', () => {
            if (!contenedor.contains(rufflePlayer)) {
                fileInput.click();
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                procesarArchivo(e.target.files[0]);
            }
        });

        // Leer el archivo SWF y cargarlo en Ruffle
        function procesarArchivo(archivo) {
            if (!archivo.name.endsWith('.swf')) {
                alert('Por favor, arrastra un archivo válido con extensión .swf');
                return;
            }

            instrucciones.style.display = 'none';
            contenedor.style.cursor = 'default';

            const player = obtenerPlayer();
            if (!contenedor.contains(player)) {
                contenedor.appendChild(player);
            }

            // Se usa FileReader para convertir el archivo en datos legibles por Ruffle
            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                const datosFlash = new Uint8Array(arrayBuffer);
                
                player.load({
                    data: datosFlash,
                    allowScriptAccess: true
                });
            };
            
            reader.readAsArrayBuffer(archivo);
        }

document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const juegoUrl = params.get('game');

    if (juegoUrl) {
        instrucciones.style.display = 'none';
        contenedor.style.cursor = 'default';
        const player = obtenerPlayer();
        if (!contenedor.contains(player)) {
            contenedor.appendChild(player);
        }
        player.load(juegoUrl);
    }
});
    </script>
</body>
