<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waffle - Iniciar Sesión</title>
    <link rel="icon" href="images/Icon.png">
    <link rel="stylesheet" href="style.css">
    <script src="script-waffle.js"></script>
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-left">
            <img src="images/logo-original.png" alt="Waffle Logo" class="auth-logo">
            <h1 class="auth-tagline">El hogar de tus juegos Flash favoritos</h1>
        </div>

        <div class="auth-right">
            <div class="auth-card">
                <h2>Inicio de Sesión</h2>
                
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" name="username" placeholder="Usuario" required>
                    </div>

                    <div class="form-group">
                        <label for="username">Correo Eletrónico</label>
                        <input type="email" id="email" name="email" placeholder="ejemplo@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
                    </div>

                    <button type="submit" class="boton-piola btn-auth" onclick="login()">Ingresar</button>

            <div id="error-msg"></div>
                <p class="auth-switch">
                    ¿No tienes cuenta? <a href="registro.html">Regístrate acá</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
